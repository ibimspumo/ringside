[package]
name = "ringside"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local poker HUD overlay and stats for PokerStars"

[lib]
name = "ringside_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ringside-cloud = { path = "../crates/ringside-cloud" }
ringside-coach = { path = "../crates/ringside-coach" }
ringside-core = { path = "../crates/ringside-core" }
ringside-engine = { path = "../crates/ringside-engine" }
ringside-learn = { path = "../crates/ringside-learn" }
ringside-solver = { path = "../crates/ringside-solver" }
# The OpenRouter key lives in the OS vault: Credential Manager on Windows, Keychain on macOS.
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
