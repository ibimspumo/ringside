name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --no-banner

  # What a change touches: the app's face needs the click-through. A manual run does everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - "src/**"
              - "src-tauri/**"
              - "static/**"
              - "e2e/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "svelte.config.js"
              - "vite.config.js"
              - "tsconfig.json"
              - ".github/workflows/ci.yml"

  # Windows only compiles and lints: the table overlay exists only there.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # The app crate embeds the built frontend.
      - run: pnpm build
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Frontend checks and the quick tests on Linux, which builds Rust about twice as fast.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: System libraries of the app crate
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --workspace --profile quick

  # The whole suite, with the tests the quick run leaves out (.config/nextest.toml), by hand;
  # every release runs it too. One test binary at a time: the solver tests use every core
  # themselves, and nextest's parallel run took 25 min instead of 17.
  tests-full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # The app crate embeds the built frontend.
      - run: pnpm build
      - run: cargo test --workspace

  # Opens every page of the real app (debug build, own data folder, fixture hand histories).
  e2e:
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: msedgedriver for the installed WebView2
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          Write-Output "WebView2 $version"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP\edgedriver.zip"
          Expand-Archive "$env:RUNNER_TEMP\edgedriver.zip" -DestinationPath "$env:RUNNER_TEMP\edgedriver"
          "MSEDGEDRIVER=$env:RUNNER_TEMP\edgedriver\msedgedriver.exe" >> $env:GITHUB_ENV
      - name: Point the app's network hosts at the test's trap
        shell: pwsh
        run: |
          $hosts = "$env:windir\System32\drivers\etc\hosts"
          Add-Content $hosts ""
          node e2e/run.mjs --hosts | Add-Content $hosts
          Resolve-DnsName ringside-api.bunny.run -Type A
      - run: pnpm install --frozen-lockfile
      - name: Debug build with the DevTools port open
        shell: pwsh
        run: |
          node e2e/run.mjs --tauri-config > "$env:RUNNER_TEMP\e2e.conf.json"
          pnpm tauri build --debug --no-bundle --config "$env:RUNNER_TEMP\e2e.conf.json"
      - run: node e2e/run.mjs
        env:
          E2E_NET_TRAP: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e
          path: target/e2e
          if-no-files-found: ignore
