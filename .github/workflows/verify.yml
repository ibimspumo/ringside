name: Verify cloud solutions

# Checks solutions clients submitted to Ringside Cloud with the engine and sets them to
# verified or rejected; also deletes rate-limit counters, queue entries whose spot is
# verified, and parser reports and submission log entries older than 90 days. The logs
# are public: ringside-verify prints solution keys and verdicts only.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-cloud
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
      - run: cargo build --release --locked -p ringside-cloud --bin ringside-verify
      # Anyone can submit: each check runs in a child process that is killed after its
      # kind's limit (120 s push/fold; 900 s postflop and shared spots, three solves on
      # these 4 cores and 16 GB, at most 8 GB each); a killed check leaves the solution
      # pending. At most --max-slow of the slow ones per run (a postflop check costs about
      # two CPU minutes), and the run starts no check that could end more than a tenth past
      # --budget-seconds, so it stays inside timeout-minutes.
      - name: Verify pending solutions
        env:
          BUNNY_DATABASE_URL: ${{ secrets.BUNNY_DATABASE_URL }}
          BUNNY_DATABASE_AUTH_TOKEN: ${{ secrets.BUNNY_DATABASE_AUTH_TOKEN }}
        run: ./target/release/ringside-verify --limit 100 --max-slow 20 --budget-seconds 2400
