name: Verify cloud solutions

# Ringside Cloud serves every solution whose form checks out at once. This re-solves a
# sample, one solution each of the clients it has verified least, bans a client whose
# sample fails and withdraws its accepted solutions; it also accepts or rejects rows
# still waiting from before, and deletes rate-limit counters, queue entries whose spot is
# served, and parser reports and submission log entries older than 90 days. The logs are
# public: ringside-verify prints solution keys, client hashes and verdicts only.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-cloud
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
      - run: cargo build --release --locked -p ringside-cloud --bin ringside-verify
      # Anyone can submit: each check runs in a child process that is killed after its
      # kind's limit (120 s push/fold; 900 s postflop and shared spots, three solves on
      # these 4 cores and 16 GB, at most 8 GB each); a killed check gives no verdict. The
      # run starts no check that could end more than a tenth past --budget-seconds; with up
      # to six minutes of purging after it, it stays inside timeout-minutes. BUNNY_API_KEY
      # drops withdrawn solutions from the CDN until they answer 404.
      - name: Sample served solutions
        env:
          BUNNY_DATABASE_URL: ${{ secrets.BUNNY_DATABASE_URL }}
          BUNNY_DATABASE_AUTH_TOKEN: ${{ secrets.BUNNY_DATABASE_AUTH_TOKEN }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: ./target/release/ringside-verify --samples 5 --budget-seconds 2400
