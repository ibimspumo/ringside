name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# The installer is built as a draft while CI checks the same commit; it is only published
# (and offered to the updater) once both have passed. The tagged commit is on main, so the CI
# run of its push is the check; only the full test suite runs here again, since CI leaves the
# slow tests out unless the solver crates changed.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 120); do
            state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
            echo "CI: ${state:-not started}"
            case "$state" in
              "completed success") exit 0 ;;
              completed*) echo "CI failed for $GITHUB_SHA"; exit 1 ;;
            esac
            sleep 30
          done
          echo "CI did not finish within an hour"; exit 1

  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo test --workspace

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Ringside ${{ github.ref_name }}
          releaseBody: Installer unten unter „Assets“ – Windows Ringside_…_x64-setup.exe, Mac (Apple Silicon) Ringside_…_aarch64.dmg, beim ersten Öffnen Rechtsklick → Öffnen. Bestehende Installationen finden das Update über „Nach Updates suchen“.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

  # After Windows, into the same draft; tauri-action adds the platform to its latest.json.
  # The app is not notarised: macOS asks once on first open (right-click, Open).
  build-mac:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-mac
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Ringside ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --bundles app,dmg

  # Windows is the main platform: a failed Mac build does not hold its release back.
  publish:
    needs: [checks, tests, build, build-mac]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.tests.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
