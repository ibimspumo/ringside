name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# The installer is built as a draft while CI checks the same commit; it is only published
# (and offered to the updater) once both have passed. The release does not run the checks a
# second time: the tagged commit is on main, so the CI run of its push is the check.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 120); do
            state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
            echo "CI: ${state:-not started}"
            case "$state" in
              "completed success") exit 0 ;;
              completed*) echo "CI failed for $GITHUB_SHA"; exit 1 ;;
            esac
            sleep 30
          done
          echo "CI did not finish within an hour"; exit 1

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Ringside ${{ github.ref_name }}
          releaseBody: Installer für Windows unten unter „Assets“ (Ringside_…_x64-setup.exe). Bestehende Installationen finden das Update über „Nach Updates suchen“.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

  publish:
    needs: [checks, build]
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
