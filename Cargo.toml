[workspace]
resolver = "3"
members = ["crates/postflop-solver", "crates/ringside-analysis", "crates/ringside-cloud", "crates/ringside-coach", "crates/ringside-core", "crates/ringside-engine", "crates/ringside-gpu", "crates/ringside-learn", "crates/ringside-play", "crates/ringside-solver", "src-tauri"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "AGPL-3.0-or-later"

# Thin LTO with parallel codegen builds the release in a fraction of the time of fat LTO;
# the difference in speed is not noticeable for this app.
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

# The solvers run millions of iterations; unoptimised they make tests and `tauri dev` crawl.
[profile.dev.package.ringside-engine]
opt-level = 3

[profile.dev.package.postflop-solver]
opt-level = 3

# The postflop solver's loops are generic and get compiled into this crate.
[profile.dev.package.ringside-solver]
opt-level = 3

[profile.dev.package.ringside-gpu]
opt-level = 3
