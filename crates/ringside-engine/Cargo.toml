[package]
name = "ringside-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hand evaluation, equity, ICM and push/fold Nash calculations for Ringside"

[dependencies]
rand = { version = "0.9", default-features = false }
miniz_oxide = "0.8"
rand_chacha = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
