# Vendored from https://github.com/b-inary/postflop-solver at 9d1509fe5077d019825f833eed04b16d342dfda1
# (Wataru Inariba, AGPL-3.0-or-later; upstream development is suspended). Local changes: explicit
# reborrows and lifetimes that Rust 1.100 requires, `try_update` for the renamed atomic method,
# the save/load feature (bincode, zstd) removed, and read accessors on `PostFlopNode` (amount,
# river, folded player) so ringside-gpu can export the tree.
[package]
name = "postflop-solver"
version = "0.1.0"
authors = ["Wataru Inariba"]
edition = "2021"
description = "An open-source postflop solver for Texas hold'em poker"
repository = "https://github.com/b-inary/postflop-solver"
license = "AGPL-3.0-or-later"
publish = false

[lib]
doctest = false

[dependencies]
once_cell = "1.18.0"
rayon = { version = "1.8.0", optional = true }
regex = "1.9.6"

[features]
default = ["rayon"]
custom-alloc = []
rayon = ["dep:rayon"]

# Upstream style, kept as is so the copy stays comparable with the original.
[lints.clippy]
chars_next_cmp = "allow"
chunks_exact_to_as_chunks = "allow"
doc_overindented_list_items = "allow"
large_const_arrays = "allow"
manual_isolate_lowest_one = "allow"
needless_maybe_sized = "allow"
needless_range_loop = "allow"
to_string_trait_impl = "allow"
