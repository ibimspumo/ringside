[package]
name = "ringside-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The spot store: one key and one lookup order for every solved spot"

[dependencies]
ringside-cloud = { path = "../ringside-cloud" }
ringside-engine = { path = "../ringside-engine" }
ringside-solver = { path = "../ringside-solver" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ringside-play = { path = "../ringside-play" }
