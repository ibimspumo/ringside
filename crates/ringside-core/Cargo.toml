[package]
name = "ringside-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PokerStars hand history parser, stats engine and local database for Ringside"

[dependencies]
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
