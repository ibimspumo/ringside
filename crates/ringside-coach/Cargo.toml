[package]
name = "ringside-coach"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AI coach for Ringside: tournament hand review by a language model that takes every number from Ringside's engine"

[dependencies]
ringside-core = { path = "../ringside-core" }
ringside-engine = { path = "../ringside-engine" }
ringside-learn = { path = "../ringside-learn" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
