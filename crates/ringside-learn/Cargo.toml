[package]
name = "ringside-learn"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Seeded poker exercises with graders, spots from own hands and mastery tracking for Ringside"

[dependencies]
rand = { version = "0.9", default-features = false }
rand_chacha = "0.9"
ringside-core = { path = "../ringside-core" }
ringside-engine = { path = "../ringside-engine" }
ringside-solver = { path = "../ringside-solver" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
